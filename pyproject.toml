[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behave-toolkit"
version = "0.1.0"
description = "Toolkit helpers for Behave projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "behave>=1.3.3",
]
authors = [
  { name = "Denis" }
]
keywords = ["behave", "bdd", "testing", "qa", "yaml"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
behave-toolkit-docs = "behave_toolkit.step_docs:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pylint>=3.2",
  "types-PyYAML>=6.0.12.20250326",
]

[project.urls]
Homepage = "https://github.com/joshlarssen/behave-toolkit"
Issues = "https://github.com/joshlarssen/behave-toolkit/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tests", "test_support.py"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["behave", "behave.*"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.11"
jobs = 0
init-hook = "import sys; from pathlib import Path; sys.path.insert(0, str(Path().resolve() / 'src'))"

[tool.pylint.messages_control]
disable = [
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 100
