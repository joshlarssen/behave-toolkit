version: 1
objects:
  session_client:
    factory: my_project.session.build_session_client
    scope: global
    cleanup: close

  api_client:
    factory: my_project.clients.ApiClient
    scope: scenario
    kwargs:
      base_url: https://example.test
    cleanup: close

  browser_session:
    factory: my_project.browser.build_browser
    scope: feature
    inject_as: browser
    args:
      - chromium
    cleanup: quit

